[package]
name = "chalk"
version = "6.0.0"
description = "Terminal string styling done right"
license = "MIT"
repository = "https://github.com/chalk/chalk"
readme = "readme.md"
edition = "2024"
rust-version = "1.88"
keywords = ["ansi", "color", "terminal", "cli", "styles"]
categories = ["command-line-interface"]
include = ["/src", "/readme.md", "/license"]

# Chalk has no dependencies, and the port keeps it that way: `ansi-styles` and
# `supports-color` are vendored under `src/vendor/`, exactly as in the original.
[dependencies]

[lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The two fixtures the integration tests spawn as child processes. They are not
# part of the published library, which is why `include` above leaves them out.
[[bin]]
name = "fixture"
path = "tests/bin/fixture.rs"
test = false
doc = false

[[bin]]
name = "force_color_fixture"
path = "tests/bin/force_color_fixture.rs"
test = false
doc = false

[[bench]]
name = "benchmark"
harness = false
